$kind: http-request
description: Déconnecte **tous les autres** appareils, garde l'appareil courant (`X-Device-Id`).
url: "{{base_url}}/devices/others"
method: DELETE
headers:
  Accept: application/json
  x-api-key: "{{x_api_key}}"
  X-Device-Id: "{{device_id}}"
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Disconnect others OK', function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json().success).to.eql(true);
      });
    language: text/javascript
order: 3000
