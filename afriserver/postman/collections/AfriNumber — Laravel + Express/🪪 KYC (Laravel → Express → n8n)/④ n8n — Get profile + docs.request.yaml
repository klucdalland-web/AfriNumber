$kind: http-request
description: n8n récupère name/first_name + URLs temporaires Storj. HMAC sur le profile_id (pas le body).
url: "{{base_url}}/n8n/profiles/{{profile_id}}"
method: GET
headers:
  Accept: application/json
  X-Signature: "{{ne_pas_remplir_manuellement}}"
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      // Signe le profile_id (GET sans body) avec SERVICE_SECRET_KEY
      const CryptoJS = require('crypto-js');
      const secret = pm.collectionVariables.get('service_secret_key') || pm.environment.get('service_secret_key');
      const pid = pm.collectionVariables.get('profile_id') || '';
      if (!secret || !pid) {
          console.warn('⚠️ service_secret_key ou profile_id manquant');
      }
      const sig = CryptoJS.HmacSHA256(pid, secret || '').toString(CryptoJS.enc.Hex);
      pm.request.headers.upsert({ key: 'X-Signature', value: sig });
      console.log('🔏 X-Signature (profile_id) =', sig.slice(0, 12) + '…');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('n8n profile', function () {
          pm.expect([200, 403, 404]).to.include(pm.response.code);
      });
    language: text/javascript
order: 4000
