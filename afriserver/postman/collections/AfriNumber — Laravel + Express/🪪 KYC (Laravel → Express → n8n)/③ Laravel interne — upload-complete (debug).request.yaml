$kind: http-request
description: |-
  Debug uniquement : simule le callback Express→Laravel.
  Pas de x-api-key / Bearer. Signature HMAC-SHA256 du body JSON brut.
  En prod, c'est Express qui appelle cette route après Storj.
url: "{{base_url}}/express/upload-complete"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
  - key: X-Signature
    value: ""
    description: Auto via Pre-request Script
body:
  type: json
  content: |-
    {
      "profile_id": "{{profile_id}}",
      "documents": [
        { "champ": "photopath", "path": "{{profile_id}}/photopath.jpg" },
        { "champ": "pieceavantpath", "path": "{{profile_id}}/pieceavantpath.jpg" },
        { "champ": "piecearrierepath", "path": "{{profile_id}}/piecearrierepath.jpg" }
      ]
    }
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      // Simule Express→Laravel : body JSON + HMAC-SHA256(body, SERVICE_SECRET_KEY)
      const CryptoJS = require('crypto-js');
      const secret = pm.collectionVariables.get('service_secret_key') || pm.environment.get('service_secret_key') || '';
      const pid = pm.collectionVariables.get('profile_id');
      if (!pid) { console.warn('⚠️ profile_id manquant — lance d\'abord Init vérification'); }
      if (!secret) { console.warn('⚠️ service_secret_key vide'); }
      const bodyObj = {
        profile_id: pid,
        documents: [
          { champ: 'photopath', path: pid + '/photopath.jpg' },
          { champ: 'pieceavantpath', path: pid + '/pieceavantpath.jpg' },
          { champ: 'piecearrierepath', path: pid + '/piecearrierepath.jpg' }
        ]
      };
      const raw = JSON.stringify(bodyObj);
      pm.request.body.update(raw);
      const sig = CryptoJS.HmacSHA256(raw, secret).toString(CryptoJS.enc.Hex);
      pm.request.headers.upsert({ key: 'Content-Type', value: 'application/json' });
      pm.request.headers.upsert({ key: 'X-Signature', value: sig });
      console.log('🔏 upload-complete signed for', pid);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('upload-complete accepté ou refusé proprement', function () {
          pm.expect([200, 403, 422]).to.include(pm.response.code);
      });
    language: text/javascript
order: 3000
