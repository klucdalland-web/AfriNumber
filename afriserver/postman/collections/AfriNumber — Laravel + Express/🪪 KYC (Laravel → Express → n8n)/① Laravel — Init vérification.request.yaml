$kind: http-request
description: |-
  Étape 1 mobile : ouvre un ticket Profile (status=en_attente_d_upload).
  Réponse : `{ statut, profile_id }` — à passer à Express comme `idprofile`.
url: "{{base_url}}/verifier/init"
method: POST
headers:
  Accept: application/json
  x-api-key: "{{x_api_key}}"
  X-Device-Id: "{{device_id}}"
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Init KYC OK', function () {
          pm.response.to.have.status(200);
          const j = pm.response.json();
          pm.expect(j.statut).to.eql('autorise');
          pm.expect(j.profile_id).to.be.a('string');
      });
      const j = pm.response.json();
      if (j.profile_id) {
          pm.collectionVariables.set('profile_id', j.profile_id);
          console.log('✅ profile_id =', j.profile_id);
      }
    language: text/javascript
order: 1000
