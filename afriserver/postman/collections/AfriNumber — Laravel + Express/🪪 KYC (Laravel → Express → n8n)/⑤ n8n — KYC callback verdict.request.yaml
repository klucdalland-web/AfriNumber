$kind: http-request
description: |-
  Verdict n8n → Laravel. kyc_status: approved | rejected | manual_review.
  X-Signature = HMAC-SHA256(profile_id) avec SERVICE_SECRET_KEY.
url: "{{base_url}}/n8n/kyc-callback"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  X-Signature: "{{ne_pas_remplir_manuellement}}"
body:
  type: json
  content: |-
    {
      "profile_id": "{{profile_id}}",
      "kyc_status": "{{kyc_status}}",
      "reason": "{{kyc_reason}}",
      "title": "KYC",
      "message": "{{kyc_reason}}"
    }
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      const CryptoJS = require('crypto-js');
      const secret = pm.collectionVariables.get('service_secret_key') || pm.environment.get('service_secret_key') || '';
      const pid = pm.collectionVariables.get('profile_id') || '';
      const status = pm.collectionVariables.get('kyc_status') || 'approved';
      const reason = pm.collectionVariables.get('kyc_reason') || 'OK';
      const bodyObj = {
        profile_id: pid,
        kyc_status: status,
        reason: reason,
        title: 'KYC',
        message: reason
      };
      const raw = JSON.stringify(bodyObj);
      pm.request.body.update(raw);
      // Signature = HMAC du profile_id (pas du body) — voir traiterVerdictN8N
      const sig = CryptoJS.HmacSHA256(pid, secret).toString(CryptoJS.enc.Hex);
      pm.request.headers.upsert({ key: 'X-Signature', value: sig });
      pm.request.headers.upsert({ key: 'Content-Type', value: 'application/json' });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('callback traité', function () {
          pm.expect([200, 403, 409, 422]).to.include(pm.response.code);
      });
    language: text/javascript
order: 5000
