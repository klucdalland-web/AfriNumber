$kind: http-request
description: |-
  `email` accepte aussi un numéro de téléphone.
  Génère un OTP `purpose=login`.

  Code OTP test actuel : `123456`.
url: "{{base_url}}/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  x-api-key: "{{x_api_key}}"
body:
  type: text
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}",
      "platform": "{{platform}}",
      "device_id": "{{device_id}}",
      "device_name": "{{device_name}}",
      "device_model": "{{device_model}}",
      "os_version": "{{os_version}}",
      "app_version": "{{app_version}}",
      "fcm_token": "{{fcm_token}}"
    }
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('otp_purpose', 'login');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Login OK (OTP envoyé)', function () {
          pm.response.to.have.status(200);
          const j = pm.response.json();
          pm.expect(j.success).to.eql(true);
      });

      try {
          const body = JSON.parse(pm.request.body.raw);
          if (body.email) pm.collectionVariables.set('email', body.email);
          if (body.password) pm.collectionVariables.set('password', body.password);
          if (body.device_id) pm.collectionVariables.set('device_id', body.device_id);
          pm.collectionVariables.set('otp_purpose', 'login');
          pm.collectionVariables.set('otp_code', '123456');
          console.log('✅ Variables capturées → email, otp_purpose=login');
      } catch (e) {}

      console.log('ℹ️ Passe ensuite à ✅ Verify OTP');
    language: text/javascript
order: 2000
