$kind: http-request
description: |-
  Nouveau password + code.

  - 5 codes erronés → lock **5 min** (423) sur email/tél
  - Succès → invalide toutes les sessions, code one-shot
  - Code test : `123456`
url: "{{base_url}}/auth/reset-password"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  x-api-key: "{{x_api_key}}"
body:
  type: text
  content: |-
    {
      "email": "{{email}}",
      "code": "{{otp_code}}",
      "password": "{{password}}",
      "password_confirmation": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Reset password', function () {
          pm.expect([200, 422, 423]).to.include(pm.response.code);
      });

      try {
          const body = JSON.parse(pm.request.body.raw);
          if (pm.response.code === 200 && body.password) {
              pm.collectionVariables.set('password', body.password);
              console.log('✅ Nouveau password sauvegardé');
          }
          if (body.email) pm.collectionVariables.set('email', body.email);
      } catch (e) {}
    language: text/javascript
order: 6000
