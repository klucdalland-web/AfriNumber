$kind: http-request
description: |-
  Demande un code reset (email **ou** phone).

  Même logique anti-spam que l'OTP :
  - 2e envoi → 1 min (429)
  - 3e → 5 min → email/tél bloqués (423)
  - puis 10, 15, 30, 60 min

  Réponse générique si compte inconnu. Code test : `123456`.
url: "{{base_url}}/auth/forgot-password"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  x-api-key: "{{x_api_key}}"
body:
  type: text
  content: |-
    {
      "email": "{{email}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Forgot password', function () {
          pm.expect([200, 423, 429]).to.include(pm.response.code);
      });

      try {
          const body = JSON.parse(pm.request.body.raw);
          if (body.email) pm.collectionVariables.set('email', body.email);
          if (body.phone_number) pm.collectionVariables.set('phone_number', body.phone_number);
      } catch (e) {}

      if (pm.response.code === 200) {
          pm.collectionVariables.set('otp_code', '123456');
          console.log('✅ Code reset test: 123456 — voir data.next_resend_at');
      } else if (pm.response.code === 423) {
          console.warn('🔒 Email/tél bloqué (envois ou codes erronés)');
      } else if (pm.response.code === 429) {
          console.warn('⏳ Cooldown 1 min');
      }
    language: text/javascript
order: 5000
