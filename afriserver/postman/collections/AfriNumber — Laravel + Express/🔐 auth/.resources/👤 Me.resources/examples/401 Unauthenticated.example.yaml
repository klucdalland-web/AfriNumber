$kind: http-example
name: '401 Unauthenticated'
request:
  url: '{{base_url}}/auth/me'
  method: GET
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "message": "Unauthenticated."
      }
order: 2000
