$kind: http-request
description: Déconnexion — vide `access_token` / `refresh_token` dans la collection.
url: "{{base_url}}/auth/logout"
method: POST
headers:
  Accept: application/json
  x-api-key: "{{x_api_key}}"
  X-Device-Id: "{{device_id}}"
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Logout OK', function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json().success).to.eql(true);
      });

      pm.collectionVariables.set('access_token', '');
      pm.collectionVariables.set('refresh_token', '');
      pm.collectionVariables.set('access_token_expires_at', '');
      pm.collectionVariables.set('refresh_token_expires_at', '');
      console.log('✅ Tokens nettoyés');
    language: text/javascript
order: 11000
