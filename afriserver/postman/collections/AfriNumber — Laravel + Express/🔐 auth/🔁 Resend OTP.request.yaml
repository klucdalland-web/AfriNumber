$kind: http-request
description: |-
  Renvoie un OTP en gardant le payload.

  **Login / register / resend partagent le même compteur d'envois.**

  Délais :
  - 2e envoi → **1 min** (429)
  - 3e envoi → **5 min** → email/tél **bloqués** (423)
  - puis 10, 15, 30, 60 min

  Aussi : 5 codes erronés → lock **5 min** (423)
url: "{{base_url}}/auth/resend-otp"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  x-api-key: "{{x_api_key}}"
body:
  type: text
  content: |-
    {
      "email": "{{email}}",
      "purpose": "{{otp_purpose}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Resend OTP', function () {
          pm.expect([200, 423, 429]).to.include(pm.response.code);
      });

      if (pm.response.code === 200) {
          pm.collectionVariables.set('otp_code', '123456');
          console.log('✅ Nouveau OTP envoyé (test: 123456)');
      } else if (pm.response.code === 423) {
          console.warn('🔒 OTP verrouillé — attendre locked_minutes_left');
      } else if (pm.response.code === 429) {
          console.warn('⏳ Cooldown 60s — attendre retry_after_seconds');
      }
    language: text/javascript
order: 4000
