$kind: http-request
description: Change le mot de passe et régénère les tokens (sauvegardés auto).
url: "{{base_url}}/auth/password"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  x-api-key: "{{x_api_key}}"
  X-Device-Id: "{{device_id}}"
body:
  type: text
  content: |-
    {
      "current_password": "{{password}}",
      "password": "NewPassword123!",
      "password_confirmation": "NewPassword123!"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Change password OK', function () {
          pm.response.to.have.status(200);
          const j = pm.response.json();
          pm.expect(j.success).to.eql(true);
      });

      const j = pm.response.json();
      if (j && j.data) {
          if (j.data.access_token) pm.collectionVariables.set('access_token', j.data.access_token);
          if (j.data.refresh_token) pm.collectionVariables.set('refresh_token', j.data.refresh_token);
      }

      try {
          const body = JSON.parse(pm.request.body.raw);
          if (body.password) {
              pm.collectionVariables.set('password', body.password);
              console.log('✅ Nouveau password + tokens sauvegardés');
          }
      } catch (e) {}
    language: text/javascript
order: 10000
