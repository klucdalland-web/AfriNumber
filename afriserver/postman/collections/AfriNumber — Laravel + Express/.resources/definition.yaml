$kind: collection
description: |-
  Collection combinée Laravel (afriserver) + Express (afriserver_file).

  ## Ordre KYC (respecter le sens)

  1. Auth → Login → Verify OTP (récupère access_token)
      
  2. KYC ① Init vérification Laravel → profile_id
      
  3. KYC ② Upload Express (3 images + idprofile)  
      → Express stocke Storj puis appelle Laravel /express/upload-complete
      
  4. (optionnel debug) KYC ③ simuler upload-complete
      
  5. (n8n) KYC ④ GET profile + ⑤ callback verdict
      

  Headers Laravel protégés : Authorization Bearer + x-api-key + X-Device-Id  
  Routes internes Express/n8n : X-Signature HMAC-SHA256 (service_secret_key)
variables:
  base_url: http://localhost:8000/api/v1
  express_base_url: http://localhost:3000
  x_api_key: ""
  service_secret_key: ""
  access_token: ""
  refresh_token: ""
  access_token_expires_at: ""
  refresh_token_expires_at: ""
  email: demo@afrinumber.test
  phone_number: "+2250700000000"
  password: Password123!
  otp_code: "123456"
  otp_purpose: login
  contrie_id: "1"
  name: Doe
  first_name: John
  platform: android
  device_id: postman-device-001
  device_name: Postman
  device_model: Postman Runner
  os_version: "14"
  app_version: 1.0.0
  fcm_token: postman-fcm-token-demo
  user_id: ""
  user_name: ""
  device_db_id: ""
  profile_id: ""
  kyc_status: approved
  kyc_reason: OK
scripts:
  - type: http:afterResponse
    code: |-
      // Capture auto tokens / user depuis réponses Laravel ApiResponse
      let json = null;
      try { json = pm.response.json(); } catch (e) { return; }
      if (!json || typeof json !== 'object') return;

      if (json.data) {
          const d = json.data;
          if (d.access_token) pm.collectionVariables.set('access_token', d.access_token);
          if (d.refresh_token) pm.collectionVariables.set('refresh_token', d.refresh_token);
          if (d.access_token_expires_at) pm.collectionVariables.set('access_token_expires_at', d.access_token_expires_at);
          if (d.refresh_token_expires_at) pm.collectionVariables.set('refresh_token_expires_at', d.refresh_token_expires_at);
          if (d.user) {
              const u = d.user.data || d.user;
              if (u.id) pm.collectionVariables.set('user_id', String(u.id));
              if (u.email) pm.collectionVariables.set('email', u.email);
              if (u.phone_number) pm.collectionVariables.set('phone_number', u.phone_number);
              if (u.name) pm.collectionVariables.set('user_name', u.name);
              if (u.first_name) pm.collectionVariables.set('first_name', u.first_name);
          }
      }
      // KYC init (format statut/profile_id)
      if (json.profile_id) pm.collectionVariables.set('profile_id', json.profile_id);
      if (json.data && json.data.idprofile) pm.collectionVariables.set('profile_id', json.data.idprofile);
      if (json.data && json.data.id) pm.collectionVariables.set('profile_id', json.data.id);
    language: text/javascript
auth:
  - id: ac7cb619-be28-4be4-b331-a6d9bb1549e1
    type: bearer
    name: bearer auth
    credentials:
      token: "{{access_token}}"
