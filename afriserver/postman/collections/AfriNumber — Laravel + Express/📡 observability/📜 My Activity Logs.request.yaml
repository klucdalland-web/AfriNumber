$kind: http-request
description: "Historique du compte.\\n\\nChaque log expose `data_before` / `data_after`, `session`, `location` et `error` (messages validation / HTTP).\\n\\nFiltres : `category` (auth|device|request|security), `action`, `level`, `device_id`, `device_identifier`, `from`, `to`, `per_page`."
url: "{{base_url}}/observability/logs?per_page=30"
method: GET
headers:
  Accept: application/json
  x-api-key: "{{x_api_key}}"
  X-Device-Id: "{{device_id}}"
queryParams:
  - key: per_page
    value: "30"
  - key: category
    value: ""
    disabled: true
  - key: action
    value: ""
    disabled: true
  - key: level
    value: ""
    disabled: true
  - key: device_id
    value: ""
    disabled: true
  - key: from
    value: ""
    disabled: true
  - key: to
    value: ""
    disabled: true
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Observability logs OK', function () {
          pm.response.to.have.status(200);
          pm.expect(pm.response.json().success).to.eql(true);
      });
    language: text/javascript
order: 1000
