$kind: http-request
description: "Même endpoint que KYC ②. Prérequis : profile_id via Init Laravel."
url: "{{express_base_url}}/files/upload"
method: POST
headers:
  Accept: application/json
body:
  type: formdata
  content:
    - type: text
      key: idprofile
      value: "{{profile_id}}"
    - type: file
      key: photopath
      src: []
    - type: file
      key: pieceavantpath
      src: []
    - type: file
      key: piecearrierepath
      src: []
auth:
  type: noauth
order: 3000
